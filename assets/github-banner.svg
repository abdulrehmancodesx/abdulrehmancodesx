<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts Import -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');
      
      .font-header {
        font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      }
      .font-body {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      }
      
      /* Animation for moving connection line dash */
      .dash-flow {
        stroke-dasharray: 10, 10;
        animation: flow 25s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -500;
        }
      }
      
      /* Subtle hover scale for nodes */
      .node-group {
        transition: transform 0.3s ease;
      }
      .node-group:hover {
        transform: scale(1.05);
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520">
      <stop offset="0%" stop-color="#01080d"/>
      <stop offset="40%" stop-color="#021520"/>
      <stop offset="80%" stop-color="#010c14"/>
      <stop offset="100%" stop-color="#000508"/>
    </linearGradient>
    
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F2FE"/>
      <stop offset="75%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-50%" defer="unknown" dur="6s" repeatCount="indefinite"/>
      <!-- Compatibility animation for moving gradient -->
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FACFE" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#4FACFE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00F2FE" fill-opacity="0.14"/>
    </pattern>

    <!-- Filters -->
    <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cardShadow"><feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/></filter>
    <filter id="nodeGlow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.6"/></filter>

    <clipPath id="clip"><rect width="1600" height="520" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base Background -->
    <rect width="1600" height="520" fill="url(#bg)"/>

    <!-- Glows -->
    <circle cx="250" cy="150" r="350" fill="url(#glowLeft)" filter="url(#blur)"/>
    <circle cx="1300" cy="350" r="400" fill="url(#glowRight)" filter="url(#blur)"/>

    <!-- Dot Matrix Grid -->
    <rect width="1600" height="520" fill="url(#dotGrid)"/>

    <!-- Technical Line Accents -->
    <g opacity="0.12">
      <line x1="92" y1="40" x2="92" y2="480" stroke="#00F2FE" stroke-width="1"/>
      <line x1="92" y1="480" x2="1508" y2="480" stroke="#00F2FE" stroke-width="1"/>
      <line x1="1508" y1="40" x2="1508" y2="480" stroke="#00F2FE" stroke-width="1"/>
    </g>

    <!-- Scanning Tech Line -->
    <path d="M0 515 H1600" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.6">
      <animate attributeName="transform" type="translate" values="translate(0,-515);translate(0,5);translate(0,-515)" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Main Text Content (Left Column) -->
    <g transform="translate(92 88)">
      <!-- Label -->
      <text x="0" y="0" fill="#00F2FE" class="font-body" font-size="16" font-weight="700" letter-spacing="6" opacity="0.9">
        FULL-STACK DEVELOPER &amp; AUTOMATION SPECIALIST
      </text>

      <!-- Main Title -->
      <text x="-4" y="96" fill="url(#textGradient)" class="font-header" font-size="90" font-weight="900" letter-spacing="-3">
        ABDUL REHMAN
      </text>

      <!-- Subtitle -->
      <text x="2" y="148" fill="#EFFFFF" class="font-body" font-size="26" font-weight="600" opacity="0.95">
        Premium Web Applications &amp; n8n Workflows
      </text>

      <!-- Description Paragraph -->
      <text x="2" y="196" fill="#A4B3BC" class="font-body" font-size="18" font-weight="400" line-height="28">
        I engineer scalable full-stack MERN apps, compile fast React Native cross-platform apps,
      </text>
      <text x="2" y="226" fill="#A4B3BC" class="font-body" font-size="18" font-weight="400">
        and design automated business operations via custom webhook pipelines.
      </text>
    </g>

    <!-- Tech Skill Pills (Left Bottom) -->
    <g transform="translate(92 376)">
      <!-- Pill 1 -->
      <g>
        <rect width="170" height="42" rx="21" fill="#001F2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="85" y="26" fill="#00F2FE" class="font-body" font-size="15" font-weight="700" text-anchor="middle">MERN Stack</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(186 0)">
        <rect width="170" height="42" rx="21" fill="#001F2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="85" y="26" fill="#FFFFFF" class="font-body" font-size="15" font-weight="600" text-anchor="middle">n8n Workflow</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(372 0)">
        <rect width="180" height="42" rx="21" fill="#001F2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="90" y="26" fill="#FFFFFF" class="font-body" font-size="15" font-weight="600" text-anchor="middle">React Native</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(568 0)">
        <rect width="160" height="42" rx="21" fill="#001F2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="80" y="26" fill="#FFFFFF" class="font-body" font-size="15" font-weight="600" text-anchor="middle">WordPress/Shop</text>
      </g>
    </g>

    <!-- Right Side Mockup: n8n Node Automation Dashboard -->
    <g transform="translate(1015 65)" filter="url(#cardShadow)">
      <!-- Glassmorphic Dashboard Panel -->
      <rect width="400" height="340" rx="24" fill="#02111a" fill-opacity="0.85" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="2"/>
      
      <!-- Panel Header Bar -->
      <path d="M2 24 C2 10.7 12.7 0 26 0 H374 C387.3 0 398 10.7 398 24 V44 H2 V24 Z" fill="#041a26"/>
      <line x1="2" y1="44" x2="398" y2="44" stroke="#00F2FE" stroke-opacity="0.15"/>
      
      <!-- Window Controls -->
      <circle cx="28" cy="22" r="6" fill="#FF5F56"/>
      <circle cx="48" cy="22" r="6" fill="#FFBD2E"/>
      <circle cx="68" cy="22" r="6" fill="#27C93F"/>
      
      <!-- Header Title -->
      <text x="200" y="27" fill="#849AA6" class="font-body" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
        N8N_AUTOMATION_PIPELINE
      </text>

      <!-- Connection Curves -->
      <g>
        <!-- Webhook -> Node 2 -->
        <path id="path1" d="M 80 185 C 130 185, 130 185, 180 185" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="3" fill="none"/>
        <path class="dash-flow" d="M 80 185 C 130 185, 130 185, 180 185" stroke="#00F2FE" stroke-width="3" fill="none"/>

        <!-- Node 2 -> DB Node -->
        <path id="path2" d="M 220 185 C 270 185, 270 115, 320 115" stroke="#4FACFE" stroke-opacity="0.3" stroke-width="3" fill="none"/>
        <path class="dash-flow" d="M 220 185 C 270 185, 270 115, 320 115" stroke="#4FACFE" stroke-width="3" fill="none"/>

        <!-- Node 2 -> Notification Node -->
        <path id="path3" d="M 220 185 C 270 185, 270 255, 320 255" stroke="#4FACFE" stroke-opacity="0.3" stroke-width="3" fill="none"/>
        <path class="dash-flow" d="M 220 185 C 270 185, 270 255, 320 255" stroke="#4FACFE" stroke-width="3" fill="none"/>
      </g>

      <!-- Active Connection Glow Particles -->
      <circle r="5" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M 80 185 C 130 185, 130 185, 180 185" />
      </circle>
      <circle r="5" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M 220 185 C 270 185, 270 115, 320 115" begin="1.5s" />
      </circle>
      <circle r="5" fill="#FFFFFF" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M 220 185 C 270 185, 270 255, 320 255" begin="1.5s" />
      </circle>

      <!-- Graph Nodes -->
      
      <!-- Node 1: Webhook Trigger (Left) -->
      <g transform="translate(45 155)" class="node-group">
        <rect width="70" height="60" rx="12" fill="#082a3c" stroke="#00F2FE" stroke-width="1.5" filter="url(#nodeGlow)"/>
        <!-- Webhook Plug Icon -->
        <path d="M 35 18 L 35 28 M 31 23 L 39 23 M 28 28 H 42 V 36 C 42 39 39 41 35 41 C 31 41 28 39 28 36 Z" stroke="#00F2FE" stroke-width="2" fill="none"/>
        <text x="35" y="50" fill="#00F2FE" class="font-body" font-size="10" font-weight="700" text-anchor="middle">WEBHOOK</text>
      </g>

      <!-- Node 2: Processing Relay (Center) -->
      <g transform="translate(165 155)" class="node-group">
        <rect width="70" height="60" rx="12" fill="#082a3c" stroke="#00F2FE" stroke-width="1.5"/>
        <!-- Code braces Icon -->
        <path d="M 29 22 L 24 27 L 29 32 M 41 22 L 46 27 L 41 32 M 38 20 L 32 34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="35" y="50" fill="#FFFFFF" class="font-body" font-size="10" font-weight="700" text-anchor="middle">API REQ</text>
      </g>

      <!-- Node 3: Database (Top Right) -->
      <g transform="translate(305 85)" class="node-group">
        <rect width="70" height="60" rx="12" fill="#082a3c" stroke="#4FACFE" stroke-width="1.5"/>
        <!-- Database Cylinder Icon -->
        <path d="M 23 20 C 23 17, 47 17, 47 20 M 23 20 V 27 C 23 30, 47 30, 47 27 V 20 M 23 27 V 34 C 23 37, 47 37, 47 34 V 27 M 23 20 C 23 23, 47 23, 47 20" stroke="#4FACFE" stroke-width="2" fill="none"/>
        <text x="35" y="50" fill="#4FACFE" class="font-body" font-size="10" font-weight="700" text-anchor="middle">DATABASE</text>
      </g>

      <!-- Node 4: Discord/Alert Notification (Bottom Right) -->
      <g transform="translate(305 225)" class="node-group">
        <rect width="70" height="60" rx="12" fill="#082a3c" stroke="#4FACFE" stroke-width="1.5"/>
        <!-- Bell Icon -->
        <path d="M 35 18 C 30 18, 27 21, 27 26 V 32 L 24 35 H 46 L 43 32 V 26 C 43 21, 40 18, 35 18 Z M 32 35 C 32 37.5, 33.5 39, 35 39 C 36.5 39, 38 37.5, 38 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="35" y="50" fill="#FFFFFF" class="font-body" font-size="10" font-weight="700" text-anchor="middle">NOTIFY</text>
      </g>

      <!-- Connection Status indicator at bottom -->
      <rect x="25" y="302" width="8" height="8" rx="4" fill="#27C93F">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="40" y="310" fill="#849AA6" class="font-body" font-size="11" font-weight="600">
        System active: abdulrehmancodesx
      </text>
    </g>
  </g>
</svg>
